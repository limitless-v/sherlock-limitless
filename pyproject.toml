[project]
name = "face-search-platform"
version = "0.1.0"
description = "Local AI-powered face recognition and OSINT profile discovery platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Face Search Platform Team" }]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
  | node_modules
  | frontend
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "node_modules", "frontend"]
known_first_party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["frontend", "tests/fixtures"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests", "tests"]
pythonpath = ["backend"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".venv", "node_modules", "frontend", "alembic/versions"]
